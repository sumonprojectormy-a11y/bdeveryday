function editionPage(date,key,page){
const managedPages=managedContent.edition?.find(issue=>issue.date===date&&issue.edition===key)?.pages;

const pages=managedPages??(date===archiveDay?editions:date==='2026-11-23'?earlierEditions:weekendEditions)[key],topics=pages[page];
const jump=(number,label,current=false)=>'<button data-page="'+number+'"'+(current?' aria-current="page"':'')+'>'+label+'</button>';
return '<div class="paper-pages">'+(page>0?jump(page-1,'আগের পাতা'):'')+pages.map((_,i)=>jump(i,bengaliDigits.format(i+1),i===page)).join('')+(page<pages.length-1?jump(page+1,'পরের পাতা'):'')+'</div><div class="paper-sheet"><h2>বিডি এভরিডে</h2><p>'+editorialDate(date)+' · '+(key==='morning'?'প্রথম সংস্করণ':'দ্বিতীয় সংস্করণ')+' · পাতা '+bengaliDigits.format(page+1)+'</p><h3>'+topics.map(topic=>categories[topic]).join(' · ')+'</h3>'+sampleStories.filter(s=>demoStoryDate(s[0])===date&&topics.includes(s[1])).map(s=>'<article><h3><a href="'+link('story',s[0])+'">'+s[2]+'</a></h3><p>'+s[3]+'</p></article>').join('')+'</div>';
}

const searchSections=Object.entries(categories).filter(([key])=>!['home','latest'].includes(key));
function searchResults(query,category=''){
const words=query.trim().normalize('NFC').toLowerCase().split(/\s+/).filter(Boolean);
const matches=words.length?orderedStories().filter(s=>{
  if(category&&s[1]!==category)return false;
  const text=[...s.slice(2,5),...s[5],categories[s[1]]].join(' ').normalize('NFC').toLowerCase();
  return words.every(word=>text.includes(word));
}):[];
return matches.length?block('খোঁজার ফলাফল',matches):'<p class="empty" role="status">কোনো খবর পাওয়া যায়নি।</p>';
}

function showBreakingHeadline(){
const story=breakingItems[breakingIndex];
if(story?.liveEvent){
get('breaking-line').innerHTML='<a href="'+liveLink(story.liveEvent.id)+'"><span class="coverage-status live-now">'+liveStatus(story.liveEvent)+'</span> '+safe(story.liveEvent.title)+'</a>';

}

}
function refreshBreakingBar(inEnglish){
const ids=[...publishedArticles.filter(item=>item.breaking).map(item=>item.id),...draftStories.filter(entry=>entry.breaking===true).map(entry=>entry.id),...sampleBreaking];
breakingItems=ids.map(id=>stories.find(story=>story[0]===id)).filter(Boolean);
const active=firstLiveEvent();
if(active)breakingItems.unshift({liveEvent:active});
breakingIndex=Math.min(breakingIndex,Math.max(0,breakingItems.length-1));
get('breaking-bar').hidden=!breakingItems.length;
get('breaking-controls').hidden=breakingItems.length<2;
showBreakingHeadline();
}
function stepBreaking(offset){
if(!breakingItems.length)return;
breakingIndex=(breakingIndex+offset+breakingItems.length)%breakingItems.length;
showBreakingHeadline();
}
get('breaking-prev').onclick=()=>stepBreaking(-1);

function render(){
